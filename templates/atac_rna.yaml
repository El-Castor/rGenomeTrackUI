name: "ATAC + RNA"
description: "ATAC-seq signal, peaks, and gene expression annotation."
created_at: "2026-05-12"
tracks:
  - track_type: bigwig
    track_name: "ATAC-seq Signal"
    params:
      title: "ATAC-seq"
      height: 3
      color: "#31a354"
      type: "fill"
      show_data_range: true
  - track_type: narrowPeak
    track_name: "ATAC Peaks"
    params:
      title: "Peaks"
      height: 1.5
      color: "#006d2c"
  - track_type: spacer
    track_name: "Spacer"
    params:
      height: 0.3
  - track_type: gtf
    track_name: "Genes"
    params:
      title: "Genes"
      height: 5
      style: "UCSC"
      display: "stacked"
      labels: true
  - track_type: x_axis
    track_name: "Genomic axis"
    params:
      where: "bottom"
