name: "Publication compact"
description: "Compact, publication-ready layout. Small heights, PDF/SVG output, small font."
created_at: "2026-05-12"
figure_settings:
  output_format: "pdf"
  width: 20
  dpi: 300
  fontsize: 10
  track_label_fraction: 0.08
tracks:
  - track_type: bigwig
    track_name: "Signal"
    params:
      title: ""
      height: 2
      color: "#1f77b4"
      type: "fill"
      show_data_range: true
  - track_type: narrowPeak
    track_name: "Peaks"
    params:
      title: ""
      height: 1
      color: "#e6550d"
  - track_type: gtf
    track_name: "Genes"
    params:
      title: ""
      height: 3
      style: "UCSC"
      display: "collapsed"
      labels: false
  - track_type: scalebar
    track_name: "Scale bar"
    params:
      height: 0.3
      where: "bottom"
  - track_type: x_axis
    track_name: "Axis"
    params:
      where: "bottom"
      fontsize: 10
